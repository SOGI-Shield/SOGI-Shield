name: Update Security Log

on:
  pull_request_target:
    types:
      - closed
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  update-security-log:
    # Run if it's a merged PR from dependabot OR a direct push from dependabot
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]') ||
      (github.event_name == 'push' && contains(github.event.head_commit.author.name, 'dependabot'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SECURITY.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let title, url;
            if (context.eventName === 'pull_request_target' || context.eventName === 'pull_request') {
              title = context.payload.pull_request.title;
              url = context.payload.pull_request.html_url;
            } else if (context.eventName === 'push') {
              title = context.payload.head_commit.message.split('\n')[0]; // Get the first line of the commit
              url = context.payload.head_commit.url;
            } else {
              console.log("Unsupported event");
              return;
            }
            
            const date = new Date().toISOString().split('T')[0];
            const entry = `| ${date} | [${title}](${url}) |`;
            
            const filePath = 'SECURITY.md';
            if (!fs.existsSync(filePath)) {
              console.log("SECURITY.md not found, nothing to do.");
              return;
            }
            
            let content = fs.readFileSync(filePath, 'utf8');
            const startMarker = '<!-- PATCH_LOG_START -->';
            const emptyRow = '| *N/A* | *No automated security patches have been recorded yet.* |';
            
            if (content.includes(startMarker)) {
              // Remove the empty placeholder row if it exists
              content = content.replace(emptyRow + '\n', '');
              content = content.replace(emptyRow, '');
              
              // Insert the new log entry directly underneath the start marker
              content = content.replace(startMarker, `${startMarker}\n${entry}`);
              fs.writeFileSync(filePath, content);
            } else {
              console.log("Marker not found in SECURITY.md");
            }

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SECURITY.md
          
          # Only commit if there are actually changes
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "docs: automate security patch log update"
            git push
          fi
