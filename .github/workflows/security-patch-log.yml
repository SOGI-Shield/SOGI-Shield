name: Update Security Log

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write

jobs:
  update-security-log:
    # Only run when a Dependabot PR is successfully merged
    if: github.event.pull_request.merged == true && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use default token, which now has write permissions thanks to 'permissions: contents: write'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update SECURITY.md
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.pull_request.title;
            const date = new Date().toISOString().split('T')[0];
            const prUrl = context.payload.pull_request.html_url;
            
            // Format as a markdown table row
            const entry = `| ${date} | [${title}](${prUrl}) |`;
            
            const filePath = 'SECURITY.md';
            let content = fs.readFileSync(filePath, 'utf8');
            const startMarker = '<!-- PATCH_LOG_START -->';
            
            if (content.includes(startMarker)) {
              // Insert the new log entry directly underneath the start marker
              content = content.replace(startMarker, `${startMarker}\n${entry}`);
              fs.writeFileSync(filePath, content);
            } else {
              console.log("Marker not found in SECURITY.md");
            }

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SECURITY.md
          
          # Only commit if there are actually changes
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "docs: automate security patch log update"
            git push
          fi
