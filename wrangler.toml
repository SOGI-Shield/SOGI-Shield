name = "sogi-shield"
compatibility_date = "2026-09-19"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
# You may need to specify KV namespaces or D1 databases here depending on your OpenNext configuration
# [[kv_namespaces]]
# binding = "NEXT_CACHE_WORKERS_KV"
# id = "..."

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
